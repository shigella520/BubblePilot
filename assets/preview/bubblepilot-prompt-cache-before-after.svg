<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">BubblePilot Prompt Cache 优化前后对比</title>
  <desc id="desc">对比优化前十轮和优化后九轮的缓存命中 Token。优化前出现三次回落，原因包括动态资源、摘要换代和一个无法完全定责的异常；优化后只出现一次由摘要换代导致的可预测回落，并在三轮内恢复。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#111c31"/>
    </linearGradient>
    <linearGradient id="beforeFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f59e0b" stop-opacity=".28"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="afterFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#35d0a3" stop-opacity=".28"/>
      <stop offset="1" stop-color="#35d0a3" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <style>
      text { font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .muted { fill:#92a1b8; }
      .small { font-size:18px; }
      .label { font-size:20px; font-weight:600; }
      .value { font-size:21px; font-weight:700; }
      .grid { stroke:#334158; stroke-width:1; stroke-dasharray:5 7; }
      .axis { fill:#7f8da5; font-size:16px; }
      .note { fill:#d5deeb; font-size:18px; }
    </style>
  </defs>

  <rect width="1600" height="1040" fill="url(#bg)"/>
  <circle cx="1450" cy="-20" r="320" fill="#29456d" opacity=".16"/>
  <circle cx="80" cy="980" r="270" fill="#0f8f78" opacity=".12"/>

  <text x="80" y="82" fill="#f7f9fc" font-size="42" font-weight="800">BubblePilot Prompt Cache 优化前后对比</text>
  <text x="80" y="120" class="muted small">线上连续对话实测 · 指标为每轮 Provider 返回的缓存命中 Token</text>

  <g transform="translate(80 158)" filter="url(#shadow)">
    <rect width="1440" height="620" rx="26" fill="#121e32" stroke="#263752"/>

    <!-- shared scale: 0 / 4k / 8k / 12k / 16k -->
    <g transform="translate(70 118)">
      <line x1="0" y1="360" x2="1300" y2="360" class="grid"/>
      <line x1="0" y1="270" x2="1300" y2="270" class="grid"/>
      <line x1="0" y1="180" x2="1300" y2="180" class="grid"/>
      <line x1="0" y1="90" x2="1300" y2="90" class="grid"/>
      <line x1="0" y1="0" x2="1300" y2="0" class="grid"/>
      <text x="-18" y="366" text-anchor="end" class="axis">0</text>
      <text x="-18" y="276" text-anchor="end" class="axis">4k</text>
      <text x="-18" y="186" text-anchor="end" class="axis">8k</text>
      <text x="-18" y="96" text-anchor="end" class="axis">12k</text>
      <text x="-18" y="6" text-anchor="end" class="axis">16k</text>
      <text x="-58" y="180" transform="rotate(-90 -58 180)" text-anchor="middle" class="axis">缓存命中 Token</text>

      <!-- divider -->
      <line x1="650" y1="-34" x2="650" y2="400" stroke="#40506a" stroke-width="2"/>

      <!-- before area and line, values: 13.44,14.848,3.712,3.712,13.312,3.712,14.72,15.744,3.712,15.744 -->
      <path d="M35 57.6 L98 25.9 L161 276.5 L224 276.5 L287 60.5 L350 276.5 L413 28.8 L476 5.8 L539 276.5 L602 5.8 L602 360 L35 360 Z" fill="url(#beforeFill)"/>
      <polyline points="35,57.6 98,25.9 161,276.5 224,276.5 287,60.5 350,276.5 413,28.8 476,5.8 539,276.5 602,5.8" fill="none" stroke="#f5a524" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- after area and line, values: 11.904,11.904,10.88,3.712,3.712,9.856,10.88,10.88,10.88 -->
      <path d="M698 92.2 L767 92.2 L836 115.2 L905 276.5 L974 276.5 L1043 138.2 L1112 115.2 L1181 115.2 L1250 115.2 L1250 360 L698 360 Z" fill="url(#afterFill)"/>
      <polyline points="698,92.2 767,92.2 836,115.2 905,276.5 974,276.5 1043,138.2 1112,115.2 1181,115.2 1250,115.2" fill="none" stroke="#35d0a3" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- points before -->
      <g fill="#121e32" stroke="#f5a524" stroke-width="4">
        <circle cx="35" cy="57.6" r="7"/><circle cx="98" cy="25.9" r="7"/><circle cx="161" cy="276.5" r="8"/>
        <circle cx="224" cy="276.5" r="8"/><circle cx="287" cy="60.5" r="7"/><circle cx="350" cy="276.5" r="8"/>
        <circle cx="413" cy="28.8" r="7"/><circle cx="476" cy="5.8" r="7"/><circle cx="539" cy="276.5" r="8"/><circle cx="602" cy="5.8" r="7"/>
      </g>
      <!-- points after -->
      <g fill="#121e32" stroke="#35d0a3" stroke-width="4">
        <circle cx="698" cy="92.2" r="7"/><circle cx="767" cy="92.2" r="7"/><circle cx="836" cy="115.2" r="7"/>
        <circle cx="905" cy="276.5" r="8"/><circle cx="974" cy="276.5" r="8"/><circle cx="1043" cy="138.2" r="7"/>
        <circle cx="1112" cy="115.2" r="7"/><circle cx="1181" cy="115.2" r="7"/><circle cx="1250" cy="115.2" r="7"/>
      </g>

      <!-- x ticks -->
      <g class="axis" text-anchor="middle">
        <text x="35" y="390">1</text><text x="98" y="390">2</text><text x="161" y="390">3</text><text x="224" y="390">4</text><text x="287" y="390">5</text>
        <text x="350" y="390">6</text><text x="413" y="390">7</text><text x="476" y="390">8</text><text x="539" y="390">9</text><text x="602" y="390">10</text>
        <text x="698" y="390">1</text><text x="767" y="390">2</text><text x="836" y="390">3</text><text x="905" y="390">4</text><text x="974" y="390">5</text>
        <text x="1043" y="390">6</text><text x="1112" y="390">7</text><text x="1181" y="390">8</text><text x="1250" y="390">9</text>
      </g>
      <text x="318" y="424" text-anchor="middle" class="axis">连续对话轮次</text>
      <text x="974" y="424" text-anchor="middle" class="axis">连续对话轮次</text>

      <!-- callouts before -->
      <g>
        <path d="M161 264 L161 215 L116 195" fill="none" stroke="#ffca70" stroke-width="2"/>
        <rect x="38" y="136" width="220" height="60" rx="12" fill="#2a2430" stroke="#8e6428"/>
        <text x="54" y="160" class="label" fill="#ffca70">回落 ①</text>
        <text x="54" y="184" class="note">图片集合变化</text>

        <path d="M350 264 L350 215 L320 195" fill="none" stroke="#ffca70" stroke-width="2"/>
        <rect x="265" y="136" width="230" height="60" rx="12" fill="#2a2430" stroke="#8e6428"/>
        <text x="281" y="160" class="label" fill="#ffca70">回落 ②</text>
        <text x="281" y="184" class="note">原因未能完全定责</text>

        <path d="M539 264 L539 215 L565 195" fill="none" stroke="#ffca70" stroke-width="2"/>
        <rect x="500" y="136" width="132" height="60" rx="12" fill="#2a2430" stroke="#8e6428"/>
        <text x="516" y="160" class="label" fill="#ffca70">回落 ③</text>
        <text x="516" y="184" class="note">摘要换代</text>
      </g>

      <!-- callout after -->
      <g>
        <path d="M905 264 L905 210 L940 188" fill="none" stroke="#6ce4bf" stroke-width="2"/>
        <rect x="854" y="124" width="250" height="65" rx="12" fill="#17302f" stroke="#267d69"/>
        <text x="871" y="149" class="label" fill="#6ce4bf">唯一明显回落</text>
        <text x="871" y="174" class="note">summary-changed · 可解释</text>
        <path d="M974 286 C1000 310 1025 305 1043 150" fill="none" stroke="#6ce4bf" stroke-width="2" stroke-dasharray="5 5"/>
        <text x="1044" y="326" text-anchor="middle" fill="#6ce4bf" font-size="17">3 轮内恢复</text>
      </g>
    </g>

    <g transform="translate(70 44)">
      <circle cx="8" cy="9" r="8" fill="#f5a524"/>
      <text x="28" y="16" fill="#f7f9fc" font-size="27" font-weight="750">优化前 · v54</text>
      <text x="212" y="16" class="muted small">随机因素会牵连前缀</text>
      <circle cx="665" cy="9" r="8" fill="#35d0a3"/>
      <text x="685" y="16" fill="#f7f9fc" font-size="27" font-weight="750">优化后 · v57</text>
      <text x="869" y="16" class="muted small">回落收敛为摘要周期</text>
    </g>
  </g>

  <g transform="translate(80 812)">
    <text x="0" y="0" fill="#f7f9fc" font-size="28" font-weight="800">变化总结</text>
    <g transform="translate(0 28)">
      <rect width="445" height="144" rx="20" fill="#172339" stroke="#31425d"/>
      <text x="24" y="38" class="muted small">明显回落次数</text>
      <text x="24" y="85" fill="#f5a524" font-size="34" font-weight="800">至少 3 次</text>
      <path d="M210 72 H290" stroke="#65748b" stroke-width="3" marker-end="url(#none)"/>
      <text x="300" y="85" fill="#35d0a3" font-size="34" font-weight="800">1 次</text>
      <text x="24" y="119" class="muted small">动态资源不再造成随机断裂</text>
    </g>
    <g transform="translate(475 28)">
      <rect width="445" height="144" rx="20" fill="#172339" stroke="#31425d"/>
      <text x="24" y="38" class="muted small">优化后正常追加</text>
      <text x="24" y="84" fill="#35d0a3" font-size="34" font-weight="800">96.6%–97.1%</text>
      <text x="24" y="119" class="muted small">共同前缀，差异集中在历史尾部</text>
    </g>
    <g transform="translate(950 28)">
      <rect width="490" height="144" rx="20" fill="#172339" stroke="#31425d"/>
      <text x="24" y="38" class="muted small">最终形态</text>
      <text x="24" y="81" fill="#f7f9fc" font-size="25" font-weight="750">随机断裂 → 可预测换代</text>
      <text x="24" y="119" class="muted small">摘要更新时回落，随后重新升温</text>
    </g>
  </g>

  <text x="1520" y="1010" text-anchor="end" fill="#64748b" font-size="15">数据时间：2026-08-11 至 2026-08-12 · BubblePilot 线上 Provider Attempt</text>
</svg>
