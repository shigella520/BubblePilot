        "200":
          description: 摘要已重置，但当前没有需要压缩的窗口消息。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationSummaryReset"
        "202":
          description: 摘要已重置，最近一个压缩周期已加入正式摘要队列。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationSummaryReset"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
