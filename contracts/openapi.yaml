      security:
        - bearerAuth: []
        - sessionAuth: []
      parameters:
        - in: path
          name: chatId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 摘要已清理并从空摘要 revision 重新开始。
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/v1/chats/{chatId}/summary/reset:
    post:
      operationId: resetChatSummary
      description: 二次验证后忽略该聊天当前摘要，只用最近一个压缩周期建立新的正式摘要基线；最新基础窗口仍保留为原始上下文，更早历史不会重新摘要。若当前消息未超过基础窗口，则只清空摘要而不调用 AI。
      security:
        - bearerAuth: []
        - sessionAuth: []
      parameters:
        - in: path
          name: chatId
          required: true
          schema:
            type: string
            format: uuid
