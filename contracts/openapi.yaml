openapi: 3.1.0
info:
  title: BubblePilot API
  version: 1.2.0
  description: BubblePilot 管理会话、二次验证、消息归档、版本化工作流、AI Provider 路由、执行与审计接口。
servers:
  - url: http://localhost:8080
paths:
  /api/v1/workflows/{workflowId}/bot-identity:
    get:
      operationId: getapiv1workflowsworkflowIdbotidentity
      description: 工作流 Bot 昵称与版本；首次昵称用于历史映射。
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - name: workflowId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 操作成功，data 返回配置或任务状态。
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
    put:
      operationId: putapiv1workflowsworkflowIdbotidentity
      description: 工作流 Bot 昵称与版本；首次昵称用于历史映射。
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - name: workflowId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [nickname, expectedVersion]
              properties:
                nickname:
                  type: string
                  minLength: 1
                  maxLength: 120
                expectedVersion:
                  type: integer
                  minimum: 0
      responses:
        "200":
          description: 操作成功，data 返回配置或任务状态。
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/v1/bot-attributions:
    get:
      operationId: getapiv1botattributions
      parameters:
        - in: query
          name: workflowId
          schema:
            type: string
            format: uuid
          description: 可选，仅返回该工作流统计、归属任务及有发送记录的聊天和重建状态。
      description: 归属预览、任务、待重建聊天及 workflows 统计（workflowId/name/nickname/total/bound/unbound/nicknamePending）。仅唯一匹配的归档消息计入各工作流，可归属 total 等于已绑定 bound 加待绑定 unbound。
      security:
        - sessionAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: 操作成功，data 返回配置或任务状态。
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/v1/bot-attributions/backfill:
    post:
      operationId: postapiv1botattributionsbackfill
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                workflowId:
                  type: string
                  format: uuid
                  description: 可选，限定当前工作流；省略时保留全局回填。
      description: 启动幂等历史归属回填，不调用模型。
      security:
        - sessionAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: 操作成功，data 返回配置或任务状态。
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/v1/bot-attributions/{jobId}/retry:
    post:
      operationId: postapiv1botattributionsjobIdretry
      description: 重试失败归属任务。
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 操作成功，data 返回配置或任务状态。
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/v1/chats/{chatId}/bot-identity/rebuild:
    post:
      operationId: postapiv1chatschatIdbotidentityrebuild
      description: 管理员手动启动身份兼容摘要和索引重建，沿用启用状态和聊天授权。target=summary 且已有未结束的当前身份重建时，仅重新入队当前版本的失败正式批次；保留已提交摘要与游标，重复请求不会重新开始。
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                target:
                  type: string
                  enum: [summary, memory, both]
                  default: both
      responses:
        "200":
          description: 操作成功，data 返回 summary/memory 是否已启动。
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/v1/ai/memory/settings:
    get:
      operationId: getapiv1aimemorysettings
      security:
        - sessionAuth: []
        - bearerAuth: []
      description: 长期聊天检索配置或脱敏状态。
      responses:
        "200":
          description: 操作成功。
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
    put:
      operationId: putapiv1aimemorysettings
      security:
        - sessionAuth: []
        - bearerAuth: []
      description: 需要敏感操作二次验证并记录审计；正文不进入普通日志。
      responses:
        "200":
          description: 操作成功。
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemorySettingsInput"
  /api/v1/ai/memory/probe:
    post:
      operationId: postapiv1aimemoryprobe
      security:
        - sessionAuth: []
        - bearerAuth: []
      description: 需要敏感操作二次验证并记录审计；正文不进入普通日志。
      responses:
        "200":
          description: 操作成功。
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemorySettingsInput"
  /api/v1/chats/{chatId}/memory:
    parameters:
      - name: chatId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getapiv1chatschatIdmemory
      security:
        - sessionAuth: []
        - bearerAuth: []
      description: 长期聊天检索配置或脱敏状态。
      responses:
        "200":
          description: 操作成功。
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
    put:
      operationId: putapiv1chatschatIdmemory
      security:
        - sessionAuth: []
        - bearerAuth: []
      description: 需要敏感操作二次验证并记录审计；正文不进入普通日志。
      responses:
        "200":
          description: 操作成功。
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryChatInput"
  /api/v1/chats/{chatId}/memory/search:
    parameters:
      - name: chatId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: postapiv1chatschatIdmemorysearch
      security:
        - sessionAuth: []
        - bearerAuth: []
      description: 需要敏感操作二次验证并记录审计；正文不进入普通日志。
      responses:
        "200":
          description: 操作成功。
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemorySearchInput"
  /api/v1/chats/{chatId}/memory/jobs:
    parameters:
      - name: chatId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getapiv1chatschatIdmemoryjobs
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
      security:
        - sessionAuth: []
        - bearerAuth: []
      description: 长期聊天检索配置或脱敏状态。
      responses:
        "200":
          description: 返回脱敏任务进度，旧任务统计可能不完整；只有当前处理任务提供动态 ETA。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryJobPage"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
    post:
      operationId: postapiv1chatschatIdmemoryjobs
      security:
        - sessionAuth: []
        - bearerAuth: []
      description: 需要敏感操作二次验证并记录审计；正文不进入普通日志。
      responses:
        "200":
          description: 操作成功。
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryJobInput"
  /api/v1/memory/jobs:
    get:
      operationId: getapiv1memoryjobs
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
      security:
        - sessionAuth: []
        - bearerAuth: []
      description: 长期聊天检索配置或脱敏状态。
      responses:
        "200":
          description: 返回脱敏任务进度，旧任务统计可能不完整；只有当前处理任务提供动态 ETA。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryJobPage"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/v1/memory/jobs/{jobId}:
    parameters:
      - name: jobId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getapiv1memoryjobsjobId
      security:
        - sessionAuth: []
        - bearerAuth: []
      description: 读取单个索引任务的脱敏详情，不读取消息正文。
      responses:
        "200":
          description: 任务详情。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/MemoryJobStatus"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/memory/jobs/{jobId}/actions:
    parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: postapiv1memoryjobsjobIdactions
      security:
        - sessionAuth: []
        - bearerAuth: []
      description: 需要敏感操作二次验证并记录审计；正文不进入普通日志。
      responses:
        "200":
          description: 操作成功。
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryJobAction"
  /api/v1/memory/retrievals/{id}/sources/{ref}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: ref
        in: path
        required: true
        schema:
          type: string
          pattern: ^M[1-9][0-9]*$
    get:
      operationId: getapiv1memoryretrievalsidsourcesref
      security:
        - sessionAuth: []
        - bearerAuth: []
      description: 需要敏感操作二次验证并记录审计；正文不进入普通日志。
      responses:
        "200":
          description: 操作成功。
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /health/live:
    get:
      operationId: getLiveness
      responses:
        "200":
          description: 应用进程存活。
  /health/ready:
    get:
      operationId: getReadiness
      responses:
        "200":
          description: 应用和数据库可用。
        "503":
          description: 数据库不可用。
  /api/v1/auth/session:
    post:
      operationId: createAdminSession
      description: 使用登录密码建立服务端管理会话；会话 Token 仅通过 HttpOnly Cookie 返回。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordInput"
      responses:
        "201":
          description: 管理会话已建立。
        "401":
          $ref: "#/components/responses/Error"
    get:
      operationId: getAdminSession
      security:
        - sessionAuth: []
      responses:
        "200":
          description: 当前管理会话与二次验证有效期。
        "401":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteAdminSession
      security:
        - sessionAuth: []
      responses:
        "204":
          description: 当前管理会话已撤销，Cookie 已清除。
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/auth/sensitive:
    post:
      operationId: verifySensitiveOperation
      description: 使用独立密码为当前管理会话建立短时效二次验证授权。
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordInput"
      responses:
        "200":
          description: 二次验证授权已绑定当前会话。
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/integrations/bluebubbles:
    get:
      operationId: getBlueBubblesSettings
      description: 返回 BlueBubbles 非敏感配置和凭据是否已配置的状态，不返回 Secret 原文。
      security:
        - bearerAuth: []
        - sessionAuth: []
      responses:
        "200":
          description: 当前 BlueBubbles 运行时配置。
        "401":
          $ref: "#/components/responses/Error"
    put:
      operationId: updateBlueBubblesSettings
      description: 更新 BlueBubbles 运行时配置；Access Token 和 Webhook Secret 仅在提交时接收并加密保存。
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                [serverUrl, sendMethod, requestTimeoutMs, expectedVersion]
              properties:
                serverUrl:
                  type: string
                  format: uri
                accessToken:
                  type: string
                  minLength: 1
                webhookSecret:
                  type: string
                  minLength: 32
                sendMethod:
                  type: string
                  enum: [private-api, apple-script]
                requestTimeoutMs:
                  type: integer
                  minimum: 1000
                  maximum: 120000
                linkPreviewEnabled:
                  type: boolean
                  default: true
                openGraphFallbackEnabled:
                  type: boolean
                  default: true
                openGraphTimeoutMs:
                  type: integer
                  minimum: 1000
                  maximum: 15000
                  default: 5000
                expectedVersion:
                  type: integer
                  minimum: 0
      responses:
        "200":
          description: 配置已保存并立即生效。
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/integrations/bluebubbles/test:
    post:
      operationId: testBlueBubblesConnection
      description: 使用当前运行时配置执行无副作用的 BlueBubbles REST 连通性检查，不返回凭据。
      security:
        - sessionAuth: []
      responses:
        "200":
          description: 返回连接状态、耗时和脱敏错误分类。
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/audit-events:
    get:
      operationId: listAuditEvents
      security:
        - bearerAuth: []
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 按时间倒序分页返回脱敏审计事件，并在 page.nextCursor 中提供下一页游标。
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/webhooks/bluebubbles:
    post:
      operationId: receiveBlueBubblesWebhook
      description: >-
        BlueBubbles 可在 URL 中使用 token 查询参数；支持自定义请求头的调用方应优先使用
        X-BubblePilot-Webhook-Secret。查询参数不会写入应用请求日志。
      parameters:
        - in: query
          name: token
          schema:
            type: string
            minLength: 32
        - in: header
          name: X-BubblePilot-Webhook-Secret
          schema:
            type: string
            minLength: 32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./bluebubbles-webhook.schema.json
      responses:
        "202":
          description: >-
            事件已归档、被监听范围忽略或判定为重复；响应同时返回自动化判定、
            匹配的触发器和执行 ID。只有首次调度未完成且仍为 evaluation-pending
            的重复事件会安全恢复判定；其他重复事件不再次执行。
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
  /api/v1/inbound-events:
    get:
      operationId: listInboundEvents
      description: >-
        按接收时间倒序返回入站事件及自动化判定状态。只包含安全元数据，
        不返回消息正文、原始 Webhook、Payload 哈希、Prompt 或凭据。
      security:
        - bearerAuth: []
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 最近的入站事件和自动化判定状态。
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/InboundEventSummary"
                  page:
                    type: object
                    required: [nextCursor]
                    properties:
                      nextCursor:
                        type: [string, "null"]
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/chats:
    get:
      operationId: listChats
      security:
        - bearerAuth: []
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 已启用监听的聊天列表。
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/chats/{chatId}/messages:
    get:
      operationId: listChatMessages
      security:
        - bearerAuth: []
        - sessionAuth: []
      parameters:
        - in: path
          name: chatId
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 指定聊天的归档消息，按发送时间倒序；已清理内容通过 contentRedactedAt、空 body 和空 attachments 明确表示。
