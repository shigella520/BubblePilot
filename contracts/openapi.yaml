      security:
        - bearerAuth: []
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/ExecutionId"
        - in: path
          name: attemptId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 返回与指定 Provider Attempt 请求哈希精确匹配的原始 JSON 请求体。
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
