    get:
      operationId: getChatParticipants
      description: 返回该聊天历史中实际出现过的非本人 sender ID，以及按聊天隔离保存的本名和昵称映射。需要敏感操作授权。
      security:
        - bearerAuth: []
        - sessionAuth: []
