      operationId: listConversationCompressions
      security:
        - bearerAuth: []
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - in: query
          name: chatId
          schema: { type: string, format: uuid }
        - in: query
          name: status
          schema:
            {
              type: string,
              enum: [queued, running, succeeded, failed, superseded],
            }
        - in: query
          name: reason
          schema:
            {
              type: string,
              enum:
                [
                  initial-catchup,
                  message-threshold,
                  policy-rebuild,
                  backlog-fast-forward,
                  manual-reset,
                ],
            }
        - in: query
          name: provider
          schema: { type: string, maxLength: 100 }
        - in: query
          name: startedFrom
          schema: { type: string, format: date-time }
        - in: query
          name: startedTo
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: 按开始时间倒序分页返回聊天级摘要压缩操作，不返回聊天正文或完整 Prompt。
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ConversationCompression"
                  page:
                    type: object
                    required: [nextCursor]
                    properties:
                      nextCursor:
                        type: [string, "null"]
                    additionalProperties: false
                additionalProperties: false
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/conversation-compressions/{compressionId}:
    get:
      operationId: getConversationCompression
      security:
        - bearerAuth: []
        - sessionAuth: []
      parameters:
        - in: path
          name: compressionId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 返回单次聊天级摘要压缩操作及脱敏诊断。
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/ConversationCompression"
                additionalProperties: false
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/conversation-compressions/{compressionId}/content:
    get:
      operationId: getConversationCompressionContent
      description: 二次验证后返回本次压缩使用的摘要和消息正文。内容可能包含饮食、健康等敏感信息；不返回完整 Prompt、Provider 原始响应或 Secret。
      security:
        - bearerAuth: []
        - sessionAuth: []
      parameters:
        - in: path
          name: compressionId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 返回受保护的摘要压缩内容。
          headers:
            Cache-Control:
              description: 防止受保护内容被浏览器或中间缓存保存。
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/ConversationCompressionContent"
                additionalProperties: false
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/conversation-compressions/{compressionId}/regenerate:
    post:
      operationId: regenerateConversationCompression
      description: 完成敏感操作二次验证后，使用当前摘要提示词和来源记录的固定输入重新生成一条验证预览；不会替换聊天当前生效摘要。
      security:
        - bearerAuth: []
        - sessionAuth: []
      parameters:
        - in: path
          name: compressionId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 同一来源记录已有重新生成任务正在排队或运行，返回该任务。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationCompressionRegeneration"
        "202":
          description: 已加入重新生成队列。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationCompressionRegeneration"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/v1/operations/status:
    get:
      operationId: getOperationsStatus
      description: 汇总失败队列、未知出站、工作流容量、AI Provider 降级和消息内容保留任务告警，不返回正文或 Secret。
      security:
        - bearerAuth: []
        - sessionAuth: []
      responses:
        "200":
          description: 当前运行状态和稳定告警码。
        "401":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    sessionAuth:
      type: apiKey
      in: cookie
      name: bubblepilot_session
  parameters:
    Limit:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      in: query
      name: cursor
      schema:
        type: string
    WorkflowId:
      in: path
      name: workflowId
      required: true
      schema:
        type: string
        format: uuid
    AiProviderId:
      in: path
      name: providerId
      required: true
      schema:
        type: string
        format: uuid
    AiRouteId:
      in: path
      name: routeId
      required: true
      schema:
        type: string
        format: uuid
    ExecutionId:
      in: path
      name: executionId
      required: true
      schema:
        type: string
        format: uuid
    DataExportId:
      in: path
      name: exportId
      required: true
      schema:
        type: string
        format: uuid
    ExpectedVersion:
      in: query
      name: expectedVersion
      required: true
      schema:
        type: integer
        minimum: 1
  schemas:
    MemorySettingsInput:
      type: object
      required:
        - enabled
        - protocol
        - baseUrl
        - model
        - dimensions
        - modelVersion
        - expectedVersion
      properties:
        enabled:
          type: boolean
        protocol:
          enum:
            - ollama
            - openai-compatible
        baseUrl:
          type: string
          format: uri
          maxLength: 2048
        model:
          type: string
          maxLength: 200
        dimensions:
          type: integer
          minimum: 1
          maximum: 16000
        modelVersion:
          type: string
          maxLength: 200
        queryPrefix:
          type: string
          maxLength: 1000
        expectedVersion:
          type: integer
          minimum: 0
        secret:
          type: string
          writeOnly: true
          maxLength: 8192
    MemorySearchInput:
      type: object
      additionalProperties: false
      required:
        - query
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 500
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        senderId:
          type: string
          maxLength: 255
    MemoryChatInput:
      type: object
      required:
        - enabled
        - expectedVersion
      properties:
        enabled:
          type: boolean
        expectedVersion:
          type: integer
          minimum: 0
    MemoryJobPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/MemoryJobStatus"
        page:
          type: object
          required: [nextCursor]
          properties:
            nextCursor: { type: [string, "null"] }
    MemoryJobStatus:
      type: object
      required: [id, status, version, progress]
      properties:
        id: { type: string, format: uuid }
        status:
          {
            type: string,
            enum:
              [
                queued,
                running,
                paused,
                succeeded,
                failed,
                cancelled,
                superseded,
              ],
          }
        version: { type: integer }
        chat_id: { type: string, format: uuid }
        chat_name: { type: [string, "null"] }
        model: { type: string }
        generation_id: { type: string, format: uuid }
        request_key:
          {
            type: [string, "null"],
            description: "显式补建任务的幂等键；增量任务为空。",
          }
        range_from: { type: [string, "null"], format: date-time }
        range_to: { type: [string, "null"], format: date-time }
        cursor_index:
          { type: string, description: "诊断游标，不是已处理数量。" }
        through_index: { type: string }
        progress:
          $ref: "#/components/schemas/MemoryJobProgress"
    MemoryJobProgress:
      type: object
      required:
        [
          scope,
          total,
          processed,
          removed,
          remaining,
          percent,
          lastProgressAt,
          generatedAt,
          estimate,
        ]
      properties:
        scope:
          {
            type: [string, "null"],
            enum: [full, remaining, null],
            description: "full 为创建时范围，remaining 为旧任务升级后剩余范围，null 表示无可靠统计。",
          }
        total: { type: integer, minimum: 0 }
        processed: { type: integer, minimum: 0 }
        removed: { type: integer, minimum: 0 }
        remaining: { type: integer, minimum: 0 }
        percent: { type: [number, "null"], minimum: 0, maximum: 100 }
        lastProgressAt: { type: [string, "null"], format: date-time }
        generatedAt: { type: string, format: date-time }
        estimate:
          type: object
          required:
            [status, messagesPerMinute, remainingSeconds, estimatedCompletionAt]
          properties:
            status:
              {
                type: string,
                enum:
                  [
                    available,
                    warming,
                    waiting,
                    stalled,
                    paused,
                    failed,
                    cancelled,
                    succeeded,
                    superseded,
                  ],
              }
            messagesPerMinute: { type: [number, "null"] }
            remainingSeconds: { type: [integer, "null"] }
            estimatedCompletionAt: { type: [string, "null"], format: date-time }
    MemoryJobInput:
      type: object
      required:
        - generationId
        - requestKey
      properties:
        generationId:
          type: string
          format: uuid
        requestKey:
          type: string
          format: uuid
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
    MemoryJobAction:
      type: object
      required:
        - action
        - expectedVersion
      properties:
        action:
          enum:
            - pause
            - resume
            - cancel
            - activate
        expectedVersion:
          type: integer
          minimum: 1
    ImageInputSettingsUpdate:
      type: object
      required:
        [
          enabled,
          includeAttachments,
          includeLinkPreviewImages,
          trustedLinkPreviewHosts,
          maxCurrentAttachments,
          maxHistoryImages,
          maxTotalImages,
          maxImageBytes,
          maxTotalBytes,
          fetchTimeoutMs,
          detail,
          expectedVersion,
        ]
      properties:
        enabled: { type: boolean }
        includeAttachments: { type: boolean }
        includeLinkPreviewImages: { type: boolean }
        trustedLinkPreviewHosts:
          type: array
          maxItems: 32
          items: { type: string, maxLength: 253 }
        maxCurrentAttachments: { type: integer, minimum: 1, maximum: 10 }
        maxHistoryImages: { type: integer, minimum: 0, maximum: 10 }
        maxTotalImages: { type: integer, minimum: 1, maximum: 20 }
        maxImageBytes: { type: integer, minimum: 1024, maximum: 52428800 }
        maxTotalBytes: { type: integer, minimum: 1024, maximum: 104857600 }
        fetchTimeoutMs: { type: integer, minimum: 1000, maximum: 60000 }
        detail: { enum: [low, high, auto] }
        expectedVersion: { type: integer, minimum: 0 }
      additionalProperties: false
    ImageInputSettingsView:
      type: object
      required:
        [
          enabled,
          includeAttachments,
          includeLinkPreviewImages,
          trustedLinkPreviewHosts,
          maxCurrentAttachments,
          maxHistoryImages,
          maxTotalImages,
          maxImageBytes,
          maxTotalBytes,
          fetchTimeoutMs,
          detail,
          source,
          version,
          updatedAt,
        ]
      properties:
        enabled: { type: boolean }
        includeAttachments: { type: boolean }
        includeLinkPreviewImages: { type: boolean }
        trustedLinkPreviewHosts:
          type: array
          maxItems: 32
          items: { type: string, maxLength: 253 }
        maxCurrentAttachments: { type: integer, minimum: 1, maximum: 10 }
        maxHistoryImages: { type: integer, minimum: 0, maximum: 10 }
        maxTotalImages: { type: integer, minimum: 1, maximum: 20 }
        maxImageBytes: { type: integer, minimum: 1024, maximum: 52428800 }
        maxTotalBytes: { type: integer, minimum: 1024, maximum: 104857600 }
        fetchTimeoutMs: { type: integer, minimum: 1000, maximum: 60000 }
        detail: { enum: [low, high, auto] }
        source: { enum: [defaults, database] }
        version: { type: integer, minimum: 0 }
        updatedAt: { type: [string, "null"], format: date-time }
      additionalProperties: false
    AgentSettingsUpdate:
      type: object
      required:
        [
          maxToolCalls,
          maxToolOutputCharacters,
          maxToolDurationMs,
          expectedVersion,
        ]
      properties:
        maxToolCalls: { type: integer, minimum: 1, maximum: 30 }
        maxToolOutputCharacters:
          { type: integer, minimum: 4000, maximum: 100000 }
        maxToolDurationMs: { type: integer, minimum: 5000, maximum: 180000 }
        expectedVersion: { type: integer, minimum: 0 }
      additionalProperties: false
    AgentSettingsView:
      type: object
      required:
        [
          maxToolCalls,
          maxToolOutputCharacters,
          maxToolDurationMs,
          source,
          version,
          updatedAt,
        ]
      properties:
        maxToolCalls: { type: integer, minimum: 1, maximum: 30 }
        maxToolOutputCharacters:
          { type: integer, minimum: 4000, maximum: 100000 }
        maxToolDurationMs: { type: integer, minimum: 5000, maximum: 180000 }
        source: { enum: [defaults, database] }
        version: { type: integer, minimum: 0 }
        updatedAt: { type: [string, "null"], format: date-time }
      additionalProperties: false
    WebSearchSettingsUpdate:
      type: object
      required:
        - maxAttempts
        - attemptTimeoutMs
        - retryDelayMs
        - maxResults
        - failurePolicy
        - expectedVersion
      properties:
        maxAttempts:
          type: integer
          minimum: 1
          maximum: 5
          description: 每个查询策略的最大 HTTP 尝试次数。
        attemptTimeoutMs:
          type: integer
          minimum: 1000
          maximum: 60000
        retryDelayMs:
          type: integer
          minimum: 0
          maximum: 5000
        maxResults:
          type: integer
          minimum: 1
          maximum: 20
        failurePolicy:
          type: string
          enum: [mode-default, fail, continue]
        expectedVersion:
          type: integer
          minimum: 0
      additionalProperties: false
    WebSearchSettingsView:
      type: object
      required:
        - maxAttempts
        - attemptTimeoutMs
        - retryDelayMs
        - maxResults
        - failurePolicy
        - source
        - version
        - updatedAt
      properties:
        maxAttempts:
          type: integer
          minimum: 1
          maximum: 5
        attemptTimeoutMs:
          type: integer
          minimum: 1000
          maximum: 60000
        retryDelayMs:
          type: integer
          minimum: 0
          maximum: 5000
        maxResults:
          type: integer
          minimum: 1
          maximum: 20
        failurePolicy:
          type: string
          enum: [mode-default, fail, continue]
        source:
          type: string
          enum: [defaults, database]
        version:
          type: integer
          minimum: 0
        updatedAt:
          type: [string, "null"]
          format: date-time
      additionalProperties: false
    ConversationSummarySettingsUpdate:
      type: object
      required:
        [
          enabled,
          includeFromMe,
          baseMessageWindow,
          characterLimit,
          redundancyMessageWindow,
          providerRouteId,
          timeZone,
          expectedVersion,
        ]
      properties:
        enabled: { type: boolean }
        includeFromMe: { type: boolean, default: true }
        baseMessageWindow:
          type: integer
          minimum: 1
          maximum: 50
          description: 摘要提交后游标之后保留的原始消息数量。
        characterLimit:
          type: integer
          minimum: 100
          maximum: 20000
          description: 上下文提取阶段的目标字符数；不限制下游 AI 请求。
        redundancyMessageWindow:
          type: integer
          minimum: 1
          maximum: 50
          description: 达到基础窗口与冗余窗口之和时每次压缩的最早消息数量。
        providerRouteId:
          oneOf:
            - type: string
              format: uuid
            - type: string
              const: ""
          description: 摘要 Provider Route；启用摘要时必须填写 UUID。
        timeZone: { type: string, minLength: 1, maxLength: 100 }
        expectedVersion: { type: integer, minimum: 0 }
      additionalProperties: false
    ConversationSummarySettingsView:
      type: object
      required:
        [
          enabled,
          includeFromMe,
          baseMessageWindow,
          characterLimit,
          redundancyMessageWindow,
          providerRouteId,
          timeZone,
          source,
          version,
          policyVersion,
          updatedAt,
        ]
      properties:
        enabled: { type: boolean }
        includeFromMe: { type: boolean }
        baseMessageWindow: { type: integer, minimum: 1, maximum: 50 }
        characterLimit: { type: integer, minimum: 100, maximum: 20000 }
        redundancyMessageWindow: { type: integer, minimum: 1, maximum: 50 }
        providerRouteId:
          oneOf:
            - type: string
              format: uuid
            - type: string
              const: ""
        timeZone: { type: string }
        source: { type: string, enum: [defaults, database] }
        version: { type: integer, minimum: 0 }
        policyVersion:
          type: integer
          minimum: 1
          deprecated: true
          description: 兼容已有摘要状态的固定代次标识；保存配置时不再递增，也不会触发重建。
        updatedAt: { type: [string, "null"], format: date-time }
      additionalProperties: false
    AiRouteTrace:
      type: object
      required:
        - id
        - executionId
        - backgroundOperationId
        - purpose
        - nodeId
        - routeId
        - routeName
        - routeVersion
        - agentTurn
        - phase
        - requestRequirements
        - fallbackEnabled
        - maxRounds
        - candidateDecisions
        - terminalStatus
        - terminalCode
        - durationMs
        - createdAt
      properties:
        id: { type: string, format: uuid }
        executionId: { type: [string, "null"], format: uuid }
        backgroundOperationId: { type: [string, "null"], format: uuid }
        purpose:
          type: string
          enum: [workflow-reply, context-summary, image-summary]
        nodeId: { type: string }
        routeId: { type: string, format: uuid }
        routeName: { type: [string, "null"] }
        routeVersion: { type: [integer, "null"], minimum: 1 }
        agentTurn: { type: integer, minimum: 1 }
        phase:
          type: string
          enum: [standard, image-original, image-degraded]
        requestRequirements:
          type: object
          required: [hasImages, allowImageDegrade, requiresTools, webSearch]
          properties:
            hasImages: { type: boolean }
            allowImageDegrade: { type: boolean }
            requiresTools: { type: boolean }
            webSearch: { type: [string, "null"] }
          additionalProperties: false
        fallbackEnabled: { type: [boolean, "null"] }
        maxRounds: { type: [integer, "null"], minimum: 1 }
        candidateDecisions:
          type: array
          items:
            type: object
            required:
              - providerId
              - providerName
              - providerVersion
              - model
              - configuredPosition
              - round
              - sequence
              - decision
              - reason
              - healthState
              - imageInputConfigured
              - imageInputProbe
            properties:
              providerId: { type: string, format: uuid }
              providerName: { type: [string, "null"] }
              providerVersion: { type: [integer, "null"], minimum: 1 }
              model: { type: [string, "null"] }
              configuredPosition: { type: integer, minimum: 1 }
              round: { type: [integer, "null"], minimum: 1 }
              sequence: { type: [integer, "null"], minimum: 1 }
              decision:
                type: string
                enum: [eligible, excluded, skipped, attempted]
              reason: { type: string }
              healthState: { type: [string, "null"] }
              imageInputConfigured: { type: [boolean, "null"] }
              imageInputProbe: { type: [string, "null"] }
            additionalProperties: false
        terminalStatus: { type: string, enum: [succeeded, failed] }
        terminalCode: { type: [string, "null"] }
        durationMs: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
      additionalProperties: false
    ConversationCompression:
      type: object
      required:
        - id
        - chatId
        - providerChatId
        - chatDisplayName
        - status
        - fromMessageIndex
        - throughMessageIndex
        - triggerMessageIndex
        - baseVersion
        - outputVersion
        - summaryPolicyVersion
        - durationMs
        - promptTokens
        - completionTokens
        - errorCode
        - startedAt
        - completedAt
        - reason
        - providerName
        - model
        - correlationId
        - includeFromMe
        - leaseOwner
        - leaseExpiresAt
        - preview
        - sourceCompressionId
        - providerAttempts
        - routeTraces
      properties:
        id: { type: string, format: uuid }
        chatId: { type: string, format: uuid }
        providerChatId: { type: string }
        chatDisplayName: { type: [string, "null"] }
        status:
          type: string
          enum: [queued, running, succeeded, failed, superseded]
        fromMessageIndex: { type: string }
        throughMessageIndex: { type: string }
        triggerMessageIndex: { type: [string, "null"] }
        baseVersion: { type: integer, minimum: 1 }
        outputVersion: { type: [integer, "null"], minimum: 1 }
        summaryPolicyVersion:
          type: integer
          minimum: 1
          deprecated: true
          description: 历史状态代次标识；仅用于关联既有数据，不表示存在策略重建流程。
        durationMs: { type: [integer, "null"], minimum: 0 }
        promptTokens: { type: [integer, "null"], minimum: 0 }
        completionTokens: { type: [integer, "null"], minimum: 0 }
        errorCode: { type: [string, "null"] }
        startedAt: { type: string, format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
        reason:
          type: string
          enum:
            [
              initial-catchup,
              message-threshold,
              policy-rebuild,
              backlog-fast-forward,
              manual-reset,
            ]
        providerName: { type: [string, "null"] }
        model: { type: [string, "null"] }
        correlationId: { type: [string, "null"], format: uuid }
        includeFromMe: { type: boolean }
        leaseOwner: { type: [string, "null"] }
        leaseExpiresAt: { type: [string, "null"], format: date-time }
        preview: { type: boolean }
        sourceCompressionId: { type: [string, "null"], format: uuid }
        statusEvents:
          type: array
          items:
            type: object
            required: [status, errorCode, createdAt]
            properties:
              status:
                type: string
                enum: [queued, running, succeeded, failed, superseded]
              errorCode: { type: [string, "null"] }
              createdAt: { type: string, format: date-time }
            additionalProperties: false
        providerAttempts:
          type: array
          description: >-
            此次压缩的完整 AI 调用路径，按 agentTurn、round、sequence、
            createdAt 和 id 升序排列，包含同一 Provider 的重试和跨 Provider
            的 fallback。
          items:
            type: object
            required:
              - id
              - routeTraceId
              - routePhase
              - providerName
              - model
              - agentTurn
              - round
              - sequence
              - status
              - durationMs
              - errorCategory
              - errorCode
              - retryable
              - fallbackAllowed
              - promptTokens
              - completionTokens
              - createdAt
            properties:
              id: { type: string, format: uuid }
              routeTraceId: { type: [string, "null"], format: uuid }
              routePhase:
                type: string
                enum: [standard, image-original, image-degraded]
              providerName: { type: string }
              model: { type: string }
              agentTurn: { type: integer, minimum: 1 }
              round: { type: integer, minimum: 1 }
              sequence: { type: integer, minimum: 1 }
              status: { type: string, enum: [succeeded, failed] }
              durationMs: { type: integer, minimum: 0 }
              errorCategory: { type: [string, "null"] }
              errorCode: { type: [string, "null"] }
              retryable: { type: [boolean, "null"] }
              fallbackAllowed: { type: [boolean, "null"] }
              promptTokens: { type: [integer, "null"], minimum: 0 }
              completionTokens: { type: [integer, "null"], minimum: 0 }
              createdAt: { type: string, format: date-time }
            additionalProperties: false
        routeTraces:
          type: array
          description: 执行时保存的路由版本、请求能力和候选选择诊断；历史记录可能为空。
          items:
            $ref: "#/components/schemas/AiRouteTrace"
        workflowExecutions:
          type: array
          items:
            type: object
            required:
              [id, workflowId, workflowName, status, createdAt, summaryVersion]
            properties:
              id: { type: string, format: uuid }
              workflowId: { type: string, format: uuid }
              workflowName: { type: string }
              status: { type: string }
              createdAt: { type: string, format: date-time }
              summaryVersion: { type: [integer, "null"], minimum: 1 }
            additionalProperties: false
      additionalProperties: false
    ConversationCompressionContent:
      type: object
      required:
        - id
        - chatId
        - providerChatId
        - chatDisplayName
        - status
        - fromMessageIndex
        - throughMessageIndex
        - baseVersion
        - outputVersion
        - previousSummary
        - outputSummary
        - preview
        - sourceCompressionId
        - messages
      properties:
        id: { type: string, format: uuid }
        chatId: { type: string, format: uuid }
        providerChatId: { type: string }
        chatDisplayName: { type: [string, "null"] }
        status:
          type: string
          enum: [queued, running, succeeded, failed, superseded]
        fromMessageIndex: { type: string }
        throughMessageIndex: { type: string }
        baseVersion: { type: integer, minimum: 1 }
        outputVersion: { type: [integer, "null"], minimum: 1 }
        previousSummary: { type: string }
        outputSummary: { type: [string, "null"] }
        preview: { type: boolean }
        sourceCompressionId: { type: [string, "null"], format: uuid }
        messages:
          type: array
          items:
            type: object
            required:
              [
                messageIndex,
                providerMessageId,
                senderId,
                sentAt,
                body,
                isFromMe,
              ]
            properties:
              messageIndex: { type: string }
              providerMessageId: { type: string }
              senderId: { type: [string, "null"] }
              sentAt: { type: string, format: date-time }
              body: { type: string }
              isFromMe: { type: boolean }
            additionalProperties: false
      additionalProperties: false
    ConversationCompressionRegeneration:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id, status]
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [created, active] }
          additionalProperties: false
      additionalProperties: false
    ConversationSummaryReset:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [chatId, status, messageCount]
          properties:
            chatId: { type: string, format: uuid }
            status: { type: string, enum: [created, not-needed] }
            id: { type: string, format: uuid }
            messageCount: { type: integer, minimum: 0 }
          additionalProperties: false
      additionalProperties: false
    InboundEventSummary:
      type: object
      required:
        - id
        - provider
        - eventId
        - correlationId
        - eventType
        - ingestionStatus
        - automationOutcome
        - receivedAt
      properties:
        id:
          type: string
          format: uuid
        provider:
          type: string
        eventId:
          type: string
        correlationId:
          type: string
          format: uuid
        eventType:
          type: string
        ingestionStatus:
          enum: [accepted, ignored, completed, failed]
        automationOutcome:
          enum:
            - unsupported-event
            - chat-not-monitored
            - evaluation-pending
            - not-evaluated
            - no-active-triggers
            - no-trigger-match
            - matched
        receivedAt:
          type: string
          format: date-time
      additionalProperties: false
    PasswordInput:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
      additionalProperties: false
    DataExportScope:
      type: object
      required: [chatId, sentFrom, sentTo, types]
      properties:
        chatId:
          type: string
          format: uuid
        sentFrom:
          type: string
          format: date-time
        sentTo:
          type: string
          format: date-time
        types:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items:
            enum: [messages, executions]
      additionalProperties: false
    DataExportConfirmation:
      type: object
      required: [expectedRecordCount, expectedSnapshotAt]
      properties:
        expectedRecordCount:
          type: integer
          minimum: 0
          maximum: 10000
        expectedSnapshotAt:
          type: string
          format: date-time
      additionalProperties: false
    AiProviderConfiguration:
      type: object
      required: [name, apiKind, baseUrl, model, secret]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        apiKind:
          enum: [chat-completions, responses]
        baseUrl:
          type: string
          format: uri
          maxLength: 2000
          pattern: ^https?://
        model:
          type: string
          minLength: 1
          maxLength: 200
        secret:
          type: string
          minLength: 1
          maxLength: 4096
          writeOnly: true
        parameters:
          type: object
          maxProperties: 20
          propertyNames:
            pattern: ^[a-zA-Z][a-zA-Z0-9_]{0,63}$
          additionalProperties:
            oneOf:
              - type: string
                maxLength: 1000
              - type: number
              - type: boolean
        requestTimeoutMs:
          type: integer
          minimum: 1000
          maximum: 360000
          default: 30000
        reasoningEffort:
          enum: [default, none, minimal, low, medium, high, xhigh, max]
          default: default
          description: Provider default reasoning effort. Default omits the protocol field; Responses uses reasoning.effort and Chat Completions uses reasoning_effort. Model support varies.
        sessionAffinity:
          enum: [disabled, session-id-header]
          default: disabled
          description: Sends a stable, hashed X-Session-ID and, for Responses, the same prompt_cache_key per provider, chat, workflow, and AI node when enabled.
        enabled:
          type: boolean
          default: true
        capabilities:
          type: object
          required: [functionCalling, hostedWebSearch, imageInput]
          properties:
            functionCalling: { type: boolean, default: false }
            hostedWebSearch: { type: boolean, default: false }
            imageInput: { type: boolean, default: false }
          additionalProperties: false
    AiUsageMetrics:
      type: object
      required:
        - requestCount
        - succeededRequestCount
        - failedRequestCount
        - promptTokens
        - completionTokens
        - reasoningTokens
        - totalTokens
        - cachedPromptTokens
        - cacheEligiblePromptTokens
        - cacheHitRate
        - cacheDataCoverage
      properties:
        requestCount: { type: integer, minimum: 0 }
        succeededRequestCount: { type: integer, minimum: 0 }
        failedRequestCount: { type: integer, minimum: 0 }
        promptTokens: { type: integer, minimum: 0 }
        completionTokens: { type: integer, minimum: 0 }
        reasoningTokens: { type: integer, minimum: 0 }
        totalTokens: { type: integer, minimum: 0 }
        cachedPromptTokens: { type: [integer, "null"], minimum: 0 }
        cacheEligiblePromptTokens: { type: integer, minimum: 0 }
        cacheHitRate: { type: [number, "null"], minimum: 0, maximum: 1 }
        cacheDataCoverage: { type: [number, "null"], minimum: 0, maximum: 1 }
    AiUsageReport:
      type: object
      required:
        - generatedAt
        - timeZone
        - hours
        - bucketMinutes
        - providers
        - periods
        - series
      properties:
        generatedAt: { type: string, format: date-time }
        timeZone: { type: string }
        hours: { type: integer, enum: [1, 6, 12, 24, 48] }
        bucketMinutes: { type: integer, enum: [1, 5, 15, 30] }
        providers:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
            additionalProperties: false
        periods:
          type: array
          items:
            type: object
            required: [providerId, providerName, today, week, month]
            properties:
              providerId: { type: string, format: uuid }
              providerName: { type: string }
              today: { $ref: "#/components/schemas/AiUsageMetrics" }
              week: { $ref: "#/components/schemas/AiUsageMetrics" }
              month: { $ref: "#/components/schemas/AiUsageMetrics" }
            additionalProperties: false
        series:
          type: array
          items:
            type: object
            required: [bucketStart, providers]
            properties:
              bucketStart: { type: string, format: date-time }
              providers:
                type: array
                items:
                  allOf:
                    - $ref: "#/components/schemas/AiUsageMetrics"
                    - type: object
                      required: [providerId]
                      properties:
                        providerId: { type: string, format: uuid }
                  unevaluatedProperties: false
            additionalProperties: false
      additionalProperties: false
    AiRouteConfiguration:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        providerIds:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid
        fallbackEnabled:
          type: boolean
          default: true
        retryPolicy:
          type: object
          properties:
            maxRounds:
              type: integer
              minimum: 1
              maximum: 5
              default: 2
            initialDelayMs:
              type: integer
              minimum: 0
              maximum: 10000
              default: 500
          additionalProperties: false
        degradePolicy:
          type: object
          properties:
            failureThreshold:
              type: integer
              minimum: 1
              maximum: 100
              default: 3
            cooldownMs:
              type: integer
              minimum: 1000
              maximum: 3600000
              default: 60000
          additionalProperties: false
        enabled:
          type: boolean
          default: true
    VersionedEnabled:
      type: object
      required: [enabled, expectedVersion]
      properties:
        enabled:
          type: boolean
        expectedVersion:
          type: integer
          minimum: 1
      additionalProperties: false
    TriggerConditions:
      type: object
      properties:
        chatIds:
          type: array
          maxItems: 100
          items:
            type: string
            minLength: 1
        senderIds:
          type: array
          maxItems: 100
          items:
            type: string
            minLength: 1
        contentTypes:
          type: array
          maxItems: 4
          items:
            enum: [text, attachment, mixed, unknown]
        text:
          oneOf:
            - type: "null"
            - type: object
              required: [kind, value]
              properties:
                kind:
                  enum: [keyword, prefix, regex]
                value:
                  type: string
                  minLength: 1
                  maxLength: 2000
                caseSensitive:
                  type: boolean
                  default: false
              additionalProperties: false
        timeWindow:
          oneOf:
            - type: "null"
            - type: object
              required: [timeZone, daysOfWeek, start, end]
              properties:
                timeZone:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: IANA 时区名称，例如 Asia/Shanghai。
                daysOfWeek:
                  type: array
                  minItems: 1
                  maxItems: 7
                  uniqueItems: true
                  items:
                    enum:
                      - monday
                      - tuesday
                      - wednesday
                      - thursday
                      - friday
                      - saturday
                      - sunday
                start:
                  type: string
                  pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
                end:
                  type: string
                  pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
              additionalProperties: false
      additionalProperties: false
    TriggerView:
      type: object
      required:
        - id
        - name
        - workflowId
        - workflowVersionId
        - workflowVersion
        - conditions
        - includeFromMe
        - enabled
        - conflictingTriggerIds
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        workflowId:
          type: string
          format: uuid
        workflowVersionId:
          type: string
          format: uuid
        workflowVersion:
          type: integer
          minimum: 1
        conditions:
          $ref: "#/components/schemas/TriggerConditions"
        includeFromMe:
          type: boolean
        enabled:
          type: boolean
        conflictingTriggerIds:
          type: array
          description: 与当前活动触发器可能同时命中的其他活动触发器 ID；仅作警告，不阻止启用。
          items:
            type: string
            format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false
    CreateTrigger:
      type: object
      required: [name, workflowId, workflowVersion, conditions]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        workflowId:
          type: string
          format: uuid
        workflowVersion:
          type: integer
          minimum: 1
        conditions:
          $ref: "#/components/schemas/TriggerConditions"
        includeFromMe:
          type: boolean
          const: false
          default: false
        enabled:
          type: boolean
          default: false
      additionalProperties: false
    UpdateTrigger:
      type: object
      required: [name, conditions]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        conditions:
          $ref: "#/components/schemas/TriggerConditions"
        includeFromMe:
          type: boolean
          const: false
          default: false
      additionalProperties: false
    TriggerPreview:
      type: object
      required: [conditions, sample]
      properties:
        conditions:
          $ref: "#/components/schemas/TriggerConditions"
        includeFromMe:
          type: boolean
          default: false
        sample:
          type: object
          required: [providerChatId, senderId, contentType, text]
          properties:
            providerChatId:
              type: string
            senderId:
              type: [string, "null"]
            sentAt:
              type: string
              format: date-time
              description: 可选的虚构样本时间；省略时使用服务端当前时间。
            contentType:
              enum: [text, attachment, mixed, unknown]
            text:
              type: [string, "null"]
            isFromMe:
              type: boolean
              default: false
          additionalProperties: false
      additionalProperties: false
  responses:
    Error:
      description: 请求失败。
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message, correlationId]
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  correlationId:
                    type: string
                    format: uuid
