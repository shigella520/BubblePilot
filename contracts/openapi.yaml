      security:
        - bearerAuth: []
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/ExecutionId"
        - in: path
          name: attemptId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 返回受保护的响应诊断，截断时明确标记；普通执行详情仅返回 rawResponse.status。
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
