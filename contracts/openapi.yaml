        - bearerAuth: []
        - sessionAuth: []
      parameters:
        - in: path
          name: chatId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion, identities]
              properties:
                expectedVersion:
                  type: integer
                  minimum: 1
                identities:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required: [senderId, realName, nickname]
                    properties:
                      senderId:
                        type: string
                        minLength: 1
                        maxLength: 500
                      realName:
                        type: [string, "null"]
                        minLength: 1
                        maxLength: 120
                      nickname:
                        type: [string, "null"]
                        minLength: 1
                        maxLength: 120
                    additionalProperties: false
              additionalProperties: false
      responses:
        "200":
          description: 成员映射已保存并返回新版本。
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
