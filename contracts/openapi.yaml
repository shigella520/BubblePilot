        "200":
          description: 聊天成员发现结果和独立的映射版本。
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    put:
      operationId: saveChatParticipantIdentities
      description: 全量替换该聊天的成员映射；只能提交该聊天历史中已经出现过的 sender ID，空数组用于清除全部映射。请求正文不会写入审计 metadata。
