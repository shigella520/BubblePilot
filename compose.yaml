name: bubblepilot

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bubblepilot}
      POSTGRES_USER: ${POSTGRES_USER:-bubblepilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - bubblepilot-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    image: ${BUBBLEPILOT_IMAGE:-ghcr.io/shigella520/bubblepilot:dev}
    build:
      context: .
    # Pass user-defined AI Provider Secret references (for example
    # OPENAI_API_KEY) without baking a fixed vendor key into this file.
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      DATABASE_QUERY_TIMEOUT_MS: ${DATABASE_QUERY_TIMEOUT_MS:-30000}
      API_ACCESS_TOKEN: ${API_ACCESS_TOKEN:?set API_ACCESS_TOKEN in .env}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-${API_ACCESS_TOKEN}}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-auto}
      APP_LOGIN_PASSWORD_HASH: ${APP_LOGIN_PASSWORD_HASH:?set APP_LOGIN_PASSWORD_HASH in .env}
      SENSITIVE_OPERATION_PASSWORD_HASH: ${SENSITIVE_OPERATION_PASSWORD_HASH:?set SENSITIVE_OPERATION_PASSWORD_HASH in .env}
      ADMIN_SESSION_TTL_SECONDS: ${ADMIN_SESSION_TTL_SECONDS:-43200}
      SENSITIVE_OPERATION_TTL_SECONDS: ${SENSITIVE_OPERATION_TTL_SECONDS:-300}
      BLUEBUBBLES_WEBHOOK_SECRET: ${BLUEBUBBLES_WEBHOOK_SECRET:?set BLUEBUBBLES_WEBHOOK_SECRET in .env}
      BLUEBUBBLES_SERVER_URL: ${BLUEBUBBLES_SERVER_URL:?set BLUEBUBBLES_SERVER_URL in .env}
      BLUEBUBBLES_ACCESS_TOKEN: ${BLUEBUBBLES_ACCESS_TOKEN:?set BLUEBUBBLES_ACCESS_TOKEN in .env}
      BLUEBUBBLES_SEND_METHOD: ${BLUEBUBBLES_SEND_METHOD:-private-api}
      BLUEBUBBLES_REQUEST_TIMEOUT_MS: ${BLUEBUBBLES_REQUEST_TIMEOUT_MS:-30000}
      ENABLE_WEB_SEARCH: ${ENABLE_WEB_SEARCH:-false}
      AI_REQUEST_TRACE_ENABLED: ${AI_REQUEST_TRACE_ENABLED:-false}
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://searxng:8080}
      SEARXNG_ENGINES: ${SEARXNG_ENGINES:-}
      SEARXNG_LANGUAGE: ${SEARXNG_LANGUAGE:-zh-CN}
      MONITORED_CHAT_IDS: ${MONITORED_CHAT_IDS:-}
      MESSAGE_RETENTION_DAYS: ${MESSAGE_RETENTION_DAYS:-90}
      WEBHOOK_BODY_LIMIT_BYTES: ${WEBHOOK_BODY_LIMIT_BYTES:-1048576}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      ADMIN_RATE_LIMIT_MAX: ${ADMIN_RATE_LIMIT_MAX:-600}
      WEBHOOK_RATE_LIMIT_MAX: ${WEBHOOK_RATE_LIMIT_MAX:-300}
      WORKFLOW_MAX_CONCURRENCY: ${WORKFLOW_MAX_CONCURRENCY:-4}
      WORKFLOW_QUEUE_CAPACITY: ${WORKFLOW_QUEUE_CAPACITY:-64}
      WORKFLOW_QUEUE_WAIT_MS: ${WORKFLOW_QUEUE_WAIT_MS:-30000}
      STALE_RETRY_SECONDS: ${STALE_RETRY_SECONDS:-300}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 20
    stop_grace_period: 330s
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET in .env}
    configs:
      - source: searxng_settings
        target: /etc/searxng/settings.yml
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  bubblepilot-postgres:

configs:
  searxng_settings:
    content: |
      use_default_settings: true
      search:
        safe_search: 1
        formats:
          - html
          - json
      server:
        secret_key: "ultrasecretkey"
        limiter: false
        image_proxy: false
