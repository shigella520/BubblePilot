name: bubblepilot

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bubblepilot}
      POSTGRES_USER: ${POSTGRES_USER:-bubblepilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - bubblepilot-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    image: ${BUBBLEPILOT_IMAGE:-ghcr.io/shigella520/bubblepilot:dev}
    build:
      context: .
    environment:
      NODE_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      API_ACCESS_TOKEN: ${API_ACCESS_TOKEN:?set API_ACCESS_TOKEN in .env}
      BLUEBUBBLES_WEBHOOK_SECRET: ${BLUEBUBBLES_WEBHOOK_SECRET:?set BLUEBUBBLES_WEBHOOK_SECRET in .env}
      MONITORED_CHAT_IDS: ${MONITORED_CHAT_IDS:-}
      WEBHOOK_BODY_LIMIT_BYTES: ${WEBHOOK_BODY_LIMIT_BYTES:-1048576}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  bubblepilot-postgres:
