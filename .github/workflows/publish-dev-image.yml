name: Publish Dev Image

run-name: Publish dev image from ${{ github.ref_name }} @ ${{ github.sha }}

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

concurrency:
  group: publish-dev-image
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_DB: bubblepilot_test
          POSTGRES_USER: bubblepilot
          POSTGRES_PASSWORD: bubblepilot_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bubblepilot -d bubblepilot_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://bubblepilot:bubblepilot_ci@127.0.0.1:5432/bubblepilot_test
      TEST_DATABASE_URL: postgresql://bubblepilot:bubblepilot_ci@127.0.0.1:5432/bubblepilot_test
      POSTGRES_PASSWORD: bubblepilot_ci
      API_ACCESS_TOKEN: ci-api-access-token-with-32-characters
      APP_LOGIN_PASSWORD_HASH: "scrypt$16384$8$1$Y2ktbG9naW4tc2FsdC0wMQ$cjoTa-eh4qqcTaDtBQl8ieVped-f3uxa_Z5sbTw6sUvhZuCdb3fSgLabQcWAl9RroMuq9Se5NIlhY7AoqVuEng"
      SENSITIVE_OPERATION_PASSWORD_HASH: "scrypt$16384$8$1$Y2ktc3RlcHVwLXNhbHQtMQ$R1rQq4sKbp_2AHvvZvn3H6drMRvn4lio1lvpc0fAU6Zvg66OjhzgdvmtYaOT_nFYElg5xkD2J9dxpI2q2WtBtw"
      BLUEBUBBLES_WEBHOOK_SECRET: ci-webhook-secret-with-32-characters
      BLUEBUBBLES_SERVER_URL: https://bluebubbles.example.test
      BLUEBUBBLES_ACCESS_TOKEN: fictional-ci-bluebubbles-token
      SEARXNG_SECRET: ci-searxng-secret-with-32-characters
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm security:check

      - name: Apply database migrations
        run: |
          pnpm db:migrate
          pnpm db:prepare-memory

      - name: Verify application
        run: pnpm verify

      - name: Verify memory database upgrade
        run: sh scripts/test-memory-upgrade.sh

      - name: Validate Docker Compose
        run: docker compose config

  sandbox-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime
        run: docker build --platform linux/amd64 -f plugins/opensandbox/runtime/Dockerfile -t bubblepilot-sandbox-python:test .
      - name: Verify runtime in 512 MiB
        run: sh plugins/opensandbox/runtime/verify.sh
      - name: Scan runtime OS and Python dependencies
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: bubblepilot-sandbox-python:test
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '0'
          format: json
          output: runtime-vulnerabilities.json
      - name: Enforce reviewed runtime risk baseline
        run: node --test plugins/opensandbox/runtime/check-scan.test.mjs && node plugins/opensandbox/runtime/check-scan.mjs runtime-vulnerabilities.json
      - name: Save scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-vulnerabilities
          path: runtime-vulnerabilities.json

  docker:
    strategy:
      matrix:
        include:
          - image: bubblepilot
            dockerfile: Dockerfile
          - image: bubblepilot-sandbox-python
            dockerfile: plugins/opensandbox/runtime/Dockerfile
          - image: bubblepilot-opensandbox-mcp
            dockerfile: plugins/opensandbox/server/Dockerfile
    runs-on: ubuntu-latest
    needs: [verify, sandbox-runtime]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/shigella520/${{ matrix.image }}
          tags: |
            type=sha
            type=raw,value=dev

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build runtime candidate
        if: matrix.image == 'bubblepilot-sandbox-python'
        run: docker build --platform linux/amd64 --label org.opencontainers.image.revision="$GITHUB_SHA" --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" -f plugins/opensandbox/runtime/Dockerfile -t runtime-candidate .
      - name: Test exact runtime candidate
        if: matrix.image == 'bubblepilot-sandbox-python'
        run: sh plugins/opensandbox/runtime/verify.sh runtime-candidate
      - name: Scan exact runtime candidate
        if: matrix.image == 'bubblepilot-sandbox-python'
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: runtime-candidate
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '0'
          format: json
          output: candidate-vulnerabilities.json
      - name: Enforce exact candidate risk baseline
        if: matrix.image == 'bubblepilot-sandbox-python'
        run: node plugins/opensandbox/runtime/check-scan.mjs candidate-vulnerabilities.json
      - name: Push tested runtime candidate
        if: matrix.image == 'bubblepilot-sandbox-python'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker tag runtime-candidate "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
      - name: Build and push Docker image
        if: matrix.image != 'bubblepilot-sandbox-python'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}-dev
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-dev
