name: Publish Dev Image

run-name: Publish dev image from ${{ github.ref_name }} @ ${{ github.sha }}

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

concurrency:
  group: publish-dev-image
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bubblepilot_test
          POSTGRES_USER: bubblepilot
          POSTGRES_PASSWORD: bubblepilot_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bubblepilot -d bubblepilot_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://bubblepilot:bubblepilot_ci@127.0.0.1:5432/bubblepilot_test
      TEST_DATABASE_URL: postgresql://bubblepilot:bubblepilot_ci@127.0.0.1:5432/bubblepilot_test
      POSTGRES_PASSWORD: bubblepilot_ci
      API_ACCESS_TOKEN: ci-api-access-token-with-32-characters
      APP_LOGIN_PASSWORD_HASH: "scrypt$16384$8$1$Y2ktbG9naW4tc2FsdC0wMQ$cjoTa-eh4qqcTaDtBQl8ieVped-f3uxa_Z5sbTw6sUvhZuCdb3fSgLabQcWAl9RroMuq9Se5NIlhY7AoqVuEng"
      SENSITIVE_OPERATION_PASSWORD_HASH: "scrypt$16384$8$1$Y2ktc3RlcHVwLXNhbHQtMQ$R1rQq4sKbp_2AHvvZvn3H6drMRvn4lio1lvpc0fAU6Zvg66OjhzgdvmtYaOT_nFYElg5xkD2J9dxpI2q2WtBtw"
      BLUEBUBBLES_WEBHOOK_SECRET: ci-webhook-secret-with-32-characters
      BLUEBUBBLES_SERVER_URL: https://bluebubbles.example.test
      BLUEBUBBLES_ACCESS_TOKEN: fictional-ci-bluebubbles-token
      SEARXNG_SECRET: ci-searxng-secret-with-32-characters
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm security:check

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Verify application
        run: pnpm verify

      - name: Validate Docker Compose
        run: docker compose config

  docker:
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/shigella520/bubblepilot
          tags: |
            type=sha
            type=raw,value=dev

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=bubblepilot-dev
          cache-to: type=gha,mode=max,scope=bubblepilot-dev
