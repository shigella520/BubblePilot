<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="880" viewBox="0 0 1440 880" role="img" aria-labelledby="title desc">
  <title id="title">BubblePilot 消息与工作流流程</title>
  <desc id="desc">一条 BlueBubbles 消息经过接收、标准化、归档、触发器匹配、工作流执行和回复，并在分支中处理忽略、AI、重试与审计。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f7f4"/>
      <stop offset="0.5" stop-color="#f2f7ff"/>
      <stop offset="1" stop-color="#fff7ee"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a84ff"/>
      <stop offset="1" stop-color="#5868eb"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b68ee"/>
      <stop offset="1" stop-color="#b45de5"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8aa1bf" stroke-opacity=".085"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="11" stdDeviation="15" flood-color="#46617f" flood-opacity=".13"/>
    </filter>
    <marker id="arrowBlue" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" viewBox="0 0 10 10">
      <path d="M0 0L10 5L0 10Z" fill="#3977dd"/>
    </marker>
    <marker id="arrowOrange" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" viewBox="0 0 10 10">
      <path d="M0 0L10 5L0 10Z" fill="#df802d"/>
    </marker>
    <marker id="arrowPurple" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" viewBox="0 0 10 10">
      <path d="M0 0L10 5L0 10Z" fill="#8066dd"/>
    </marker>
    <marker id="arrowGreen" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" viewBox="0 0 10 10">
      <path d="M0 0L10 5L0 10Z" fill="#36a865"/>
    </marker>
  </defs>

  <rect width="1440" height="880" rx="34" fill="url(#bg)"/>
  <rect width="1440" height="880" rx="34" fill="url(#grid)"/>
  <circle cx="1300" cy="70" r="210" fill="#ff9f43" opacity=".07"/>
  <circle cx="90" cy="820" r="230" fill="#0a84ff" opacity=".06"/>

  <text x="64" y="72" fill="#171717" font-family="Avenir Next, Inter, PingFang SC, sans-serif" font-size="32" font-weight="700">From Message to Reply</text>
  <text x="64" y="108" fill="#6f6b66" font-family="Avenir Next, Inter, PingFang SC, sans-serif" font-size="17">接收、归档、匹配、编排和回复均可追踪、可重试且幂等</text>

  <rect x="876" y="52" width="500" height="42" rx="21" fill="#fff" fill-opacity=".75" stroke="#fff"/>
  <circle cx="902" cy="73" r="6" fill="#0a84ff"/>
  <text x="917" y="78" fill="#536b83" font-family="Avenir Next, Inter, PingFang SC, sans-serif" font-size="12" font-weight="700">主流程</text>
  <circle cx="981" cy="73" r="6" fill="#ff8c42"/>
  <text x="996" y="78" fill="#536b83" font-family="Avenir Next, Inter, PingFang SC, sans-serif" font-size="12" font-weight="700">忽略 / 过滤</text>
  <circle cx="1098" cy="73" r="6" fill="#8a68df"/>
  <text x="1113" y="78" fill="#536b83" font-family="Avenir Next, Inter, PingFang SC, sans-serif" font-size="12" font-weight="700">AI 节点</text>
  <circle cx="1192" cy="73" r="6" fill="#32c46c"/>
  <text x="1207" y="78" fill="#536b83" font-family="Avenir Next, Inter, PingFang SC, sans-serif" font-size="12" font-weight="700">持久化 / 审计</text>

  <text x="64" y="160" fill="#8a8883" font-family="Avenir Next, Inter, PingFang SC, sans-serif" font-size="13" font-weight="700" letter-spacing="2">MESSAGE EXECUTION LOOP</text>

  <g filter="url(#shadow)">
    <rect x="64" y="186" width="180" height="158" rx="26" fill="#fff" fill-opacity=".9" stroke="#fff"/>
    <circle cx="104" cy="226" r="22" fill="#edf5ff"/><text x="104" y="233" fill="#0a84ff" font-family="Avenir Next, Inter, PingFang SC, sans-serif" font-size="20" font-weight="800" text-anchor="middle">1</text>
    <text x="140" y="226" fill="#171717" font-family="Avenir Next, Inter, PingFang SC, sans-serif" font-size="19" font-weight="700">接收事件</text>
    <text x="154" y="272" fill="#617184" font-family="Avenir Next, Inter, PingFang SC, sans-serif" font-size="13" text-anchor="middle">校验 Webhook</text>
    <text x="154" y="298" fill="#617184" font-family="Avenir Next, Inter, PingFang SC, sans-serif" font-size="13" text-anchor="middle">登记 eventId</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="290" y="186" width="180" height="158" rx="26" fill="#fff" fill-opacity=".9" stroke="#fff"/>
    <circle cx="330" cy="226" r="22" fill="#edf5ff"/><text x="330" y="233" fill="#0a84ff" font-family="Avenir Next, Inter, PingFang SC, sans-serif" font-size="20" font-weight="800" text-anchor="middle">2</text>
    <text x="366" y="226" fill="#171717" font-family="Avenir Next, Inter, PingFang SC, sans-serif" font-size="19" font-weight="700">标准化</text>
    <text x="380" y="272" fill="#617184" font-family="Avenir Next, Inter, PingFang SC, sans-serif" font-size="13" text-anchor="middle">生成消息信封</text>
    <text x="380" y="298" fill="#617184" font-family="Avenir Next, Inter, PingFang SC, sans-serif" font-size="13" text-anchor="middle">计算 correlationId</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="516" y="186" width="180" height="158" rx="26" fill="#fff" fill-opacity=".9" stroke="#fff"/>
    <circle cx="556" cy="226" r="22" fill="#edf5ff"/><text x="556" y="233" fill="#0a84ff" font-family="Avenir Next, Inter, PingFang SC, sans-serif" font-size="20" font-weight="800" text-anchor="middle">3</text>
    <text x="592" y="226" fill="#171717" font-family="Avenir Next, Inter, PingFang SC, sans-serif" font-size="19" font-weight="700">归档消息</text>
    <text x="606" y="272" fill="#617184" font-family="Avenir Next, Inter, PingFang SC, sans-serif" font-size="13" text-anchor="middle">检查监听范围</text>
    <text x="606" y="298" fill="#617184" font-family="Avenir Next, Inter, PingFang SC, sans-serif" font-size="13" text-anchor="middle">保存消息元数据</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="742" y="186" width="180" height="158" rx="26" fill="#fff" fill-opacity=".9" stroke="#fff"/>
    <circle cx="782" cy="226" r="22" fill="#edf5ff"/><text x="782" y="233" fill="#0a84ff" font-family="Avenir Next, Inter, PingFang SC, sans-serif" font-size="20" font-weight="800" text-anchor="middle">4</text>
    <text x="818" y="226" fill="#171717" font-family="Avenir Next, Inter, PingFang SC, sans-serif" font-size="19" font-weight="700">匹配触发器</text>
    <text x="832" y="272" fill="#617184" font-family="Avenir Next, Inter, PingFang SC, sans-serif" font-size="13" text-anchor="middle">聊天 · 发送者 · 文本</text>
    <text x="832" y="298" fill="#617184" font-family="Avenir Next, Inter, PingFang SC, sans-serif" font-size="13" text-anchor="middle">时间窗 · 消息类型</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="968" y="186" width="180" height="158" rx="26" fill="#fff" fill-opacity=".9" stroke="#fff"/>
    <circle cx="1008" cy="226" r="22" fill="#f0eaff"/><text x="1008" y="233" fill="#8066dd" font-family="Avenir Next, Inter, PingFang SC, sans-serif" font-size="20" font-weight="800" text-anchor="middle">5</text>
    <text x="1044" y="226" fill="#171717" font-family="Avenir Next, Inter, PingFang SC, sans-serif" font-size="19" font-weight="700">执行工作流</text>
    <text x="1058" y="272" fill="#617184" font-family="Avenir Next, Inter, PingFang SC, sans-serif" font-size="13" text-anchor="middle">锁定发布版本</text>
    <text x="1058" y="298" fill="#617184" font-family="Avenir Next, Inter, PingFang SC, sans-serif" font-size="13" text-anchor="middle">执行节点和分支</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1194" y="186" width="180" height="158" rx="26" fill="#fff" fill-opacity=".9" stroke="#fff"/>
    <circle cx="1234" cy="226" r="22" fill="#edf8f0"/><text x="1234" y="233" fill="#2b9e5c" font-family="Avenir Next, Inter, PingFang SC, sans-serif" font-size="20" font-weight="800" text-anchor="middle">6</text>
    <text x="1270" y="226" fill="#171717" font-family="Avenir Next, Inter, PingFang SC, sans-serif" font-size="19" font-weight="700">发送回复</text>
    <text x="1284" y="272" fill="#617184" font-family="Avenir Next, Inter, PingFang SC, sans-serif" font-size="13" text-anchor="middle">回复幂等键</text>
    <text x="1284" y="298" fill="#617184" font-family="Avenir Next, Inter, PingFang SC, sans-serif" font-size="13" text-anchor="middle">记录投递结果</text>
  </g>

  <path d="M244 265H289" fill="none" stroke="#3977dd" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
  <path d="M470 265H515" fill="none" stroke="#3977dd" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
  <path d="M696 265H741" fill="none" stroke="#3977dd" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
  <path d="M922 265H967" fill="none" stroke="#3977dd" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
  <path d="M1148 265H1193" fill="none" stroke="#3977dd" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowBlue)"/>

  <path d="M832 344V488H610" fill="none" stroke="#df802d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#arrowOrange)"/>
  <g filter="url(#shadow)">
    <rect x="360" y="432" width="250" height="112" rx="24" fill="#fffaf3" stroke="#ffe2c4" stroke-width="2"/>
    <circle cx="398" cy="470" r="19" fill="#fff2e4"/>
    <path d="M389 470h18M394 463l-5 7 5 7M402 463l5 7-5 7" fill="none" stroke="#df802d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="430" y="474" fill="#171717" font-family="Avenir Next, Inter, PingFang SC, sans-serif" font-size="18" font-weight="700">忽略事件</text>
    <text x="485" y="510" fill="#7c6b58" font-family="Avenir Next, Inter, PingFang SC, sans-serif" font-size="13" text-anchor="middle">不在监听范围或未匹配</text>
  </g>

  <path d="M1058 344V432" fill="none" stroke="#8066dd" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#arrowPurple)"/>
  <g filter="url(#shadow)">
    <rect x="933" y="432" width="250" height="112" rx="24" fill="#f8f5ff" stroke="#e6ddff" stroke-width="2"/>
    <circle cx="971" cy="470" r="19" fill="#f0eaff"/>
    <path d="M961 465c5-6 15-6 20 0M962 474c5 5 14 5 19 0M968 485h8" fill="none" stroke="#8066dd" stroke-width="2.2" stroke-linecap="round"/>
    <text x="1003" y="474" fill="#171717" font-family="Avenir Next, Inter, PingFang SC, sans-serif" font-size="18" font-weight="700">AI 节点</text>
    <text x="1058" y="510" fill="#6d6390" font-family="Avenir Next, Inter, PingFang SC, sans-serif" font-size="13" text-anchor="middle">读取有限上下文并校验输出</text>
  </g>

  <text x="64" y="604" fill="#8a8883" font-family="Avenir Next, Inter, PingFang SC, sans-serif" font-size="13" font-weight="700" letter-spacing="2">RECOVERY &amp; OBSERVABILITY</text>
  <g filter="url(#shadow)">
    <rect x="64" y="630" width="420" height="132" rx="26" fill="#fff" fill-opacity=".9" stroke="#fff"/>
    <rect x="90" y="656" width="150" height="34" rx="17" fill="#edf8f0"/>
    <text x="106" y="679" fill="#2b9e5c" font-family="Avenir Next, Inter, PingFang SC, sans-serif" font-size="13" font-weight="800">Execution Trace</text>
    <text x="106" y="720" fill="#617184" font-family="Avenir Next, Inter, PingFang SC, sans-serif" font-size="14">每个节点记录状态、耗时、attempt 和 errorCode</text>
    <text x="106" y="744" fill="#617184" font-family="Avenir Next, Inter, PingFang SC, sans-serif" font-size="14">通过 correlationId 串起一次完整执行</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="522" y="630" width="420" height="132" rx="26" fill="#fff" fill-opacity=".9" stroke="#fff"/>
    <rect x="548" y="656" width="150" height="34" rx="17" fill="#fff2e4"/>
    <text x="564" y="679" fill="#c66a16" font-family="Avenir Next, Inter, PingFang SC, sans-serif" font-size="13" font-weight="800">Retry / Dead Letter</text>
    <text x="564" y="720" fill="#617184" font-family="Avenir Next, Inter, PingFang SC, sans-serif" font-size="14">可重试错误使用有限次数和退避</text>
    <text x="564" y="744" fill="#617184" font-family="Avenir Next, Inter, PingFang SC, sans-serif" font-size="14">达到上限后交给人工处理</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="980" y="630" width="396" height="132" rx="26" fill="#fff" fill-opacity=".9" stroke="#fff"/>
    <rect x="1006" y="656" width="140" height="34" rx="17" fill="#edf5ff"/>
    <text x="1022" y="679" fill="#2875d2" font-family="Avenir Next, Inter, PingFang SC, sans-serif" font-size="13" font-weight="800">Audit &amp; Search</text>
    <text x="1022" y="720" fill="#617184" font-family="Avenir Next, Inter, PingFang SC, sans-serif" font-size="14">管理端按授权读取归档和执行记录</text>
    <text x="1022" y="744" fill="#617184" font-family="Avenir Next, Inter, PingFang SC, sans-serif" font-size="14">敏感操作需要二次验证并留下审计</text>
  </g>

  <path d="M1284 344V590H1178V629" fill="none" stroke="#36a865" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#arrowGreen)"/>
  <path d="M1058 544V590H732V629" fill="none" stroke="#8066dd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#arrowPurple)"/>
</svg>
