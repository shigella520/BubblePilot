<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">BubblePilot 总体架构</title>
  <desc id="desc">BlueBubbles 和 Web 管理端通过应用核心访问消息归档、触发器匹配、工作流编排、节点注册表和执行审计数据。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f7f4"/>
      <stop offset="0.5" stop-color="#f1f6ff"/>
      <stop offset="1" stop-color="#fff5ea"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a84ff"/>
      <stop offset="0.55" stop-color="#6675ff"/>
      <stop offset="1" stop-color="#ff9f43"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#116fe8"/>
      <stop offset="1" stop-color="#6957e8"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8aa1bf" stroke-opacity=".09"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#46617f" flood-opacity=".14"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#46617f" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" viewBox="0 0 10 10">
      <path d="M0 0L10 5L0 10Z" fill="#7890ad"/>
    </marker>
    <marker id="arrowBlue" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" viewBox="0 0 10 10">
      <path d="M0 0L10 5L0 10Z" fill="#4a78df"/>
    </marker>
    <marker id="arrowOrange" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" viewBox="0 0 10 10">
      <path d="M0 0L10 5L0 10Z" fill="#df802d"/>
    </marker>
  </defs>

  <rect width="1440" height="820" rx="34" fill="url(#bg)"/>
  <rect width="1440" height="820" rx="34" fill="url(#grid)"/>
  <circle cx="1300" cy="70" r="210" fill="#ffad55" opacity=".08"/>
  <circle cx="90" cy="760" r="230" fill="#0a84ff" opacity=".07"/>

  <text x="64" y="72" fill="#171717" font-family="Avenir Next, Inter, PingFang SC, sans-serif" font-size="32" font-weight="700">BubblePilot Architecture</text>
  <text x="64" y="108" fill="#6f6b66" font-family="Avenir Next, Inter, PingFang SC, sans-serif" font-size="17">消息接入、可编排工作流与敏感数据边界清晰分离</text>
  <rect x="1140" y="52" width="236" height="40" rx="20" fill="#ffffff" fill-opacity=".76" stroke="#ffffff"/>
  <circle cx="1166" cy="72" r="7" fill="#32c46c"/>
  <text x="1184" y="78" fill="#466078" font-family="Avenir Next, Inter, PingFang SC, sans-serif" font-size="15" font-weight="600">Modular monolith · self-hosted</text>

  <text x="64" y="154" fill="#8a8883" font-family="Avenir Next, Inter, PingFang SC, sans-serif" font-size="13" font-weight="700" letter-spacing="2">EXPERIENCE &amp; EXTERNAL SERVICES</text>

