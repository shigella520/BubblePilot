    <text x="1180" y="224" fill="#171717" font-family="Avenir Next, Inter, PingFang SC, sans-serif" font-size="21" font-weight="700">Web Admin</text>
    <text x="1122" y="282" fill="#617184" font-family="Avenir Next, Inter, PingFang SC, sans-serif" font-size="14">搜索 · 配置 · 执行详情 · 审计</text>
